---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vol1
  namespace: training
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  nfs:
    path: /mnt/vol1
    server: 192.168.56.11

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vol2
  namespace: training
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  nfs:
    path: /mnt/vol2
    server: 192.168.56.11
