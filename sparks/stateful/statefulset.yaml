apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sf
spec:
  selector:
    matchLabels:
      app: redis
  serviceName: redis-svc
  replicas: 2
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.0.11
        ports:
        - containerPort: 6379
          name: redis