apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: local-l2-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.56.150-192.168.56.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - local-l2-pool