apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-static
  namespace: training
spec:
  replicas: 3
  selector:
    matchLabels:
      app: http-static
  template:
    metadata:
      labels:
        app: http-static
    spec:
      containers:
      - name: apache
        image: httpd:2.4.57
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"  
        ports:
        - containerPort: 80
        volumeMounts:
        - name: images-storage
          mountPath: /usr/local/apache2/htdocs
      volumes:
      - name: images-storage
        persistentVolumeClaim:
          claimName: images-pvc