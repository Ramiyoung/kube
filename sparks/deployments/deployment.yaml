apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-training
  namespace: training
  labels:
    app.kubernetes.io/name: web-training
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web-training
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-training
    spec:
      containers:
      - name: nginx
        image: nginx:1.29.4
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"
        ports:
        - containerPort: 80